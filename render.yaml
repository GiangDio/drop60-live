# Render Blueprint Specification for DROP60.LIVE
# Documentation: https://render.com/docs/blueprint-spec

services:
  # -------------------------------------------------------------
  # DROP60.LIVE Realtime Backend (Express + Socket.io + Prisma)
  # -------------------------------------------------------------
  - type: web
    name: drop60-live-server
    runtime: node
    plan: free
    region: singapore
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGINS
        value: "https://drop60-live.vercel.app,http://localhost:3000"
      - key: CLIENT_URL
        value: "https://drop60-live.vercel.app"
      - key: SERVER_BASE_URL
        value: "https://drop60-live-server.onrender.com"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: drop60-db
          property: connectionString
      - key: TTS_PROVIDER
        value: google
      - key: BANK_ID
        value: MB
      - key: BANK_ACCOUNT_NO
        value: "0123456789"
      - key: BANK_ACCOUNT_NAME
        value: "NGUYEN VAN A"
      - key: WEBHOOK_SECRET_KEY
        generateValue: true

# ---------------------------------------------------------------
# Managed PostgreSQL Database on Render
# ---------------------------------------------------------------
databases:
  - name: drop60-db
    plan: free
    databaseName: drop60_live
    user: drop60_user
    region: singapore
